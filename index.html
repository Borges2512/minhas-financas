<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minhas Finanças</title>
  <meta name="description" content="Controle pessoal de entradas e saídas">

  <!-- Faz o app abrir em tela cheia no iPhone, com nome e ícone próprios -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Minhas Finanças">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="icon" type="image/png" href="icones/icone-192.png">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-barra">
      <span class="marca-app">Minhas Finanças</span>
      <button type="button" id="btn-ajustes" class="btn-icone" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <nav class="navegacao-mes" aria-label="Escolher mês">
      <button type="button" id="btn-mes-anterior" class="btn-icone" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="mes-centro">
        <h1 id="titulo-mes">&nbsp;</h1>
        <button type="button" id="btn-hoje" class="btn-hoje" hidden>Voltar para o mês atual</button>
      </div>
      <button type="button" id="btn-mes-seguinte" class="btn-icone" aria-label="Próximo mês">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>

    <section id="resumo" class="resumo" aria-label="Resumo do mês"></section>
  </header>

  <main id="lista" class="lista"></main>

  <button type="button" id="btn-adicionar" class="fab" aria-label="Adicionar lançamento">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="camadas"></div>

  <!-- A ordem importa: cada arquivo usa os anteriores -->
  <script src="js/formato.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tela-mes.js"></script>
  <script src="js/tela-lancamento.js"></script>
  <script src="js/tela-ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
